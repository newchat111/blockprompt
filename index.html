<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CodeBlocks - LLM Code Generator</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <div class="app">
        <header class="header">
            <h1>🧩 CodeBlocks</h1>
            <p>Drag blocks to nest them • Build code structure</p>
        </header>

        <div class="toolbar">
            <div class="block-palette">
                <button class="palette-btn palette-class" data-type="class">
                    <span class="palette-dot"></span>
                    <span class="palette-name">Class</span>
                </button>
                <button class="palette-btn palette-function" data-type="function">
                    <span class="palette-dot"></span>
                    <span class="palette-name">Function</span>
                </button>
                <button class="palette-btn palette-variable" data-type="variable">
                    <span class="palette-dot"></span>
                    <span class="palette-name">Variable</span>
                </button>
                <button class="palette-btn palette-custom" data-type="custom">
                    <span class="palette-dot"></span>
                    <span class="palette-name">Custom</span>
                </button>
                <button class="palette-btn palette-import" data-type="import">
                    <span class="palette-dot"></span>
                    <span class="palette-name">Import</span>
                </button>
            </div>
            <div class="toolbar-actions">
                <button class="action-btn action-secondary" id="clearBtn" title="Clear all blocks">
                    <span class="action-label">Clear</span>
                </button>
                <button class="action-btn action-primary" id="canvasModeBtn" title="Open Grid Canvas">
                    <span class="action-label">Canvas</span>
                </button>
            </div>
        </div>

        <div class="main">
            <div class="sidebar">
                <div class="sidebar-header">
                    <h3>💾 Saved Blocks</h3>
                    <button id="clearSidebarBtn" class="btn-clear-sidebar" title="Clear all saved blocks">×</button>
                </div>
                <div id="sidebarContent" class="sidebar-content">
                    <div class="sidebar-hint">
                        Drag blocks here to save<br>
                        <small>Click to restore</small>
                    </div>
                </div>
            </div>

            <div class="canvas-container">
                <div id="canvas" class="canvas">
                    <div class="canvas-hint">
                        Click buttons to add blocks<br>
                        <small>Drag Function/Variable blocks into Class blocks<br>
                        Drag Variable blocks into Function blocks</small>
                    </div>
                </div>
            </div>

            <div class="output-panel">
                <div class="output-header">
                    <h3>📄 Generated Prompt (JSON)</h3>
                    <button id="copyBtn" class="btn-copy">Copy</button>
                </div>
                <pre id="output" class="output"></pre>
            </div>
        </div>
    </div>

    <script src="js/utils.js"></script>
    <script src="js/app.js"></script>
</body>
</html>
