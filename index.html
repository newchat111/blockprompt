<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CodeBlocks - LLM Code Generator</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <div class="app">
        <header class="header">
            <h1>🧩 CodeBlocks</h1>
            <p>Drag blocks to nest them • Build code structure</p>
        </header>

        <div class="toolbar">
            <button class="btn btn-class" data-type="class">+ Class</button>
            <button class="btn btn-function" data-type="function">+ Function</button>
            <button class="btn btn-variable" data-type="variable">+ Variable</button>
            <button class="btn btn-custom" data-type="custom">+ Custom</button>
            <button class="btn btn-import" data-type="import">+ Import</button>
            <button class="btn btn-clear" id="clearBtn">Clear All</button>
            <button class="btn btn-canvas-mode" id="canvasModeBtn" title="Open Grid Canvas">🖼️ Canvas</button>
            <button class="btn btn-toggle-sidebar" id="toggleSidebarBtn" title="Toggle Sidebar">📖 Sidebar</button>
        </div>

        <div class="main">
            <div class="sidebar">
                <div class="sidebar-header">
                    <h3>💾 Saved Blocks</h3>
                    <button id="clearSidebarBtn" class="btn-clear-sidebar" title="Clear all saved blocks">×</button>
                </div>
                <div id="sidebarContent" class="sidebar-content">
                    <div class="sidebar-hint">
                        Drag blocks here to save<br>
                        <small>Click to restore</small>
                    </div>
                </div>
            </div>

            <div class="canvas-container">
                <div id="canvas" class="canvas">
                    <div class="canvas-hint">
                        Click buttons to add blocks<br>
                        <small>Drag Function/Variable blocks into Class blocks<br>
                        Drag Variable blocks into Function blocks</small>
                    </div>
                </div>
                <!-- Canvas sidebar - inherits from main sidebar -->
                <div id="canvasSidebar" class="canvas-sidebar hidden">
                    <div class="canvas-sidebar-header">
                        <h4>Saved Blocks</h4>
                        <button id="closeCanvasSidebarBtn" class="btn-close-canvas-sidebar" title="Close">×</button>
                    </div>
                    <div id="canvasSidebarContent" class="canvas-sidebar-content"></div>
                </div>
            </div>

            <div class="output-panel">
                <div class="output-header">
                    <h3>📄 Generated Prompt (JSON)</h3>
                    <button id="copyBtn" class="btn-copy">Copy</button>
                </div>
                <pre id="output" class="output"></pre>
            </div>
        </div>
    </div>

    <script src="js/app.js"></script>
</body>
</html>
